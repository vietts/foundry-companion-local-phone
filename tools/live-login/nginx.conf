# Serve solo /accesso/: tutto il resto del dominio resta a Foundry (il router Traefik prende solo questo prefisso).
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /accesso { return 301 /accesso/; }

  location /accesso/ {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    try_files $uri /accesso/index.html;
  }

  location / { return 404; }
}
